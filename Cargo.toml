[workspace]
resolver = "2"
members = [
  "cache",
  "cache-core",
]

[workspace.dependencies]
clap = { version = "4.5.18", features = ["derive", "env"] }
thiserror = "1.0.64"
tokio = { version = "1.32.0", features = ["full", "tracing"] }
tokio-util = "0.7.9"
tracing = "0.1.37"
tracing-subscriber = "0.3.17"

